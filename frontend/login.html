<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>深海海底智能探测系统 - 登录展示页</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 10% 20%, #071a2e 0%, #020811 40%, #041c2c 100%);
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-box {
      background: rgba(15, 23, 42, 0.85);
      padding: 40px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      width: 400px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    h1 {
      margin-bottom: 30px;
      font-size: 24px;
      background: linear-gradient(120deg, #00f0ff, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      color: white;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { box-shadow: 0 0 15px rgba(14, 165, 233, 0.5); }
    .footer { margin-top: 20px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body data-page-purpose="demo-only">
  <div class="login-box">
    <h1>深海海底智能探测系统</h1>
    <input type="text" placeholder="用户名">
    <input type="password" placeholder="密码">
    <button onclick="alert('登录成功！即将跳转...')">登 录</button>
    <div class="footer">Deep Sea Intelligent Detection System v1.0</div>
  </div>
</body>
</html>
