# Rendered by install-production.sh. __SERVER_NAME__ must be the approved
# company DNS name; do not make this vhost the catch-all Apache default.
<VirtualHost *:80>
    ServerName __SERVER_NAME__
    DocumentRoot /opt/deep-sea-explorer/frontend

    LimitRequestBody 52428800

    <Directory /opt/deep-sea-explorer/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Replace development localhost endpoints while preserving a same-origin UI.
    Alias /js/runtime-config.js /etc/deep-sea-explorer/runtime-config.js

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:9001/ connectiontimeout=5 timeout=300
    ProxyPassReverse /api/ http://127.0.0.1:9001/
    ProxyPass /speech/ http://127.0.0.1:9009/ connectiontimeout=5 timeout=180
    ProxyPassReverse /speech/ http://127.0.0.1:9009/

    ErrorLog ${APACHE_LOG_DIR}/deep-sea-explorer-error.log
    CustomLog ${APACHE_LOG_DIR}/deep-sea-explorer-access.log combined
</VirtualHost>
